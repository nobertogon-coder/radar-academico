services:
  - type: web
    name: radar-academico
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: INITIAL_PRECEPTOR_CPF
        sync: false
      - key: INITIAL_PRECEPTOR_PASSWORD
        sync: false
      - key: INITIAL_PRECEPTOR_NAME
        value: Preceptor Administrador
    disk:
      name: radar-data
      mountPath: /var/data
      sizeGB: 1
