<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Radar Acadêmico - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .login-card { max-width: 400px; width: 100%; padding: 3rem 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; }
        .btn-radar { background-color: #1a2b4c; color: white; font-weight: 500; transition: 0.3s; }
        .btn-radar:hover { background-color: #0f192d; color: white; }
        .btn-cadastro { background-color: #B8860B; color: white; font-weight: 500; transition: 0.3s; text-decoration: none; }
        .btn-cadastro:hover { background-color: #8e6800; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo em Imagem -->
        <div class="text-center mb-4">
            <img src="/static/logo.jpg" alt="Logo Radar Acadêmico" style="max-width: 220px;">
        </div>
        
        <form action="/painel" method="GET">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">USUÁRIO (CPF)</label>
                <input type="text" class="form-control bg-light" placeholder="Digite seu CPF" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">SENHA</label>
                <input type="password" class="form-control bg-light" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-radar w-100 py-2 mb-3">Entrar no Sistema</button>
        </form>
        
        <!-- Botão Real de Cadastro -->
        <div class="text-center border-top pt-4">
            <p class="mb-2 text-muted small">Primeiro acesso ou novo estagiário?</p>
            <a href="/cadastro" class="btn btn-cadastro w-100 py-2 btn-sm d-block">Cadastrar Novo Usuário</a>
        </div>
    </div>
</body>
</html>
