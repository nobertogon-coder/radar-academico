<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Cadastro - Radar Acadêmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .login-card { max-width: 450px; width: 100%; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; }
        .btn-cadastro { background-color: #B8860B; color: white; font-weight: 500; transition: 0.3s; }
        .btn-cadastro:hover { background-color: #8e6800; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h4 class="fw-bold" style="color: #1a2b4c;">Novo Estagiário</h4>
            <p class="text-muted small">Preencha seus dados para acesso ao HARF</p>
        </div>
        
        <!-- O formulário envia os dados para a rota /cadastrar_usuario no Python -->
        <form action="/cadastrar_usuario" method="POST">
            <div class="mb-3">
                <input type="text" class="form-control bg-light" name="nome" placeholder="Nome Completo" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control bg-light" name="cpf" placeholder="CPF (Apenas números)" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control bg-light" name="faculdade" placeholder="Faculdade" required>
                </div>
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control bg-light" name="periodo" placeholder="Período" required>
                </div>
            </div>
            <div class="mb-4">
                <input type="password" class="form-control bg-light" name="senha" placeholder="Crie uma senha" required>
            </div>
            <button type="submit" class="btn btn-cadastro w-100 py-2 mb-2">Finalizar Cadastro</button>
            <a href="/" class="btn btn-outline-secondary w-100 py-2">Voltar ao Login</a>
        </form>
    </div>
</body>
</html>
