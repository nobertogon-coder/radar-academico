<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Radar Acadêmico' }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/app.css" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark radar-nav"><div class="container"><a class="navbar-brand fw-bold" href="/painel">RADAR ACADÊMICO</a>{% if user %}<div class="d-flex align-items-center gap-3 text-white"><span class="small">{{ user.nome }}</span><form method="post" action="/logout"><button class="btn btn-sm btn-outline-light">Sair</button></form></div>{% endif %}</div></nav><main class="container py-4">{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}{% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}{% block content %}{% endblock %}</main><footer class="container py-4 text-center text-muted small">Radar Acadêmico · Ambiente educacional · Siga os protocolos institucionais vigentes.</footer></body></html>
