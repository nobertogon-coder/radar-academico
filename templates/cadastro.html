{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><section class="card shadow-sm p-4"><h1 class="h3">Cadastro de estagiário</h1><p class="text-muted">O acesso será liberado após validação do preceptor.</p><form method="post" action="/cadastro"><label class="form-label">Nome completo</label><input class="form-control mb-2" name="nome" required maxlength="140"><label class="form-label">CPF</label><input class="form-control mb-2" name="cpf" required maxlength="14"><label class="form-label">Faculdade</label><input class="form-control mb-2" name="faculdade"><label class="form-label">Período</label><input class="form-control mb-2" name="periodo"><label class="form-label">Senha (mínimo 10 caracteres)</label><input class="form-control mb-2" type="password" name="senha" minlength="10" required><label class="form-label">Confirmar senha</label><input class="form-control mb-3" type="password" name="confirmar" minlength="10" required><button class="btn btn-radar w-100">Enviar cadastro</button></form><p class="mt-3 mb-0"><a href="/">Voltar ao login</a></p></section></div>{% endblock %}
